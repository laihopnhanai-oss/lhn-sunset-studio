
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LHN SUNSET STUDIO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #fff4e8;
  background: #21151b;
}

header {
  padding: 24px;
  text-align: center;
  background: linear-gradient(
    120deg,
    #351b26,
    #c94c35,
    #ffad48
  );
}

header h1 {
  margin: 0;
  font-size: 34px;
  letter-spacing: 4px;
}

header p {
  margin-bottom: 0;
}

main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 20px;
}

.panel {
  padding: 20px;
  border: 1px solid #68404a;
  border-radius: 16px;
  background: #302028;
}

h2 {
  font-size: 18px;
  color: #ffc16b;
}

button,
select,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button,
select {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #8b554c;
  background: #482b32;
  color: white;
}

button:hover {
  background: #784239;
}

input[type="file"] {
  width: 100%;
  margin: 15px 0;
}

label {
  display: block;
  margin: 14px 0 6px;
}

select {
  width: 100%;
}

.preview {
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1c1319;
  border-radius: 12px;
  overflow: hidden;
}

.preview img {
  width: 100%;
  height: auto;
  display: block;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

.primary {
  background: linear-gradient(90deg, #ff8b27, #ffc45b);
  color: #321c19;
  font-weight: bold;
}

footer {
  padding: 20px;
  text-align: center;
  color: #d7b8ad;
}

@media (max-width: 760px) {
  main {
    grid-template-columns: 1fr;
    padding: 10px;
  }

  header h1 {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<header>
  <h1>LHN SUNSET</h1>
  <p>PHOTO & ART AI STUDIO</p>
  <p>Golden Hour Collection</p>
</header>

<main>

<section class="panel">

<h2>1. Ảnh đầu vào</h2>

<label for="upload">Tải ảnh phong cảnh</label>

<input
  type="file"
  id="upload"
  accept="image/png,image/jpeg,image/webp"
>

<h2>2. Phong cách</h2>

<label for="style">Chọn phong cách</label>

<select id="style">
  <option>Classic Sunset</option>
  <option>Misty Sunset</option>
  <option>Golden Mirror</option>
  <option>Pink Sunset</option>
  <option>Dramatic Sky</option>
  <option>Serene Evening</option>
</select>

<h2>3. Tùy chỉnh</h2>

<label for="color">Màu hoàng hôn</label>

<select id="color">
  <option value="orange">Cam vàng</option>
  <option value="pink">Hồng đào</option>
  <option value="red">Đỏ rực</option>
  <option value="purple">Tím lam</option>
  <option value="gold">Vàng kim</option>
</select>

<label for="sun">Mặt trời</label>

<select id="sun">
  <option>Có mặt trời</option>
  <option>Sát đường chân trời</option>
  <option>Không có mặt trời</option>
</select>

<label for="mirror">Phản chiếu mặt nước</label>

<select id="mirror">
  <option>Phản chiếu rõ</option>
  <option>Phản chiếu nhẹ</option>
  <option>Không phản chiếu</option>
</select>

<label for="fog">Sương mù</label>

<select id="fog">
  <option>Không</option>
  <option>Nhẹ</option>
  <option>Vừa</option>
  <option>Dày</option>
</select>

<label for="cloud">Mây</label>

<select id="cloud">
  <option>Trời quang</option>
  <option>Mây nhẹ</option>
  <option>Mây đẹp</option>
  <option>Mây kịch tính</option>
</select>

<label for="temperature">Nhiệt độ màu</label>

<select id="temperature">
  <option value="4800">4800K - Ấm nhẹ</option>
  <option value="5500">5500K - Trung tính</option>
  <option value="6500">6500K - Hoàng hôn ấm</option>
  <option value="7500">7500K - Lạnh</option>
</select>

</section>

<section class="panel">

<h2>4. Preview</h2>

<div class="preview">
  <img id="preview" alt="Ảnh Sunset preview">
</div>

<h2>5. Kích thước xuất ảnh</h2>

<select id="size">
  <option value="2048x1536">
    Facebook - 2048 x 1536
  </option>

  <option value="2048x2048">
    Ảnh vuông - 2048 x 2048
  </option>

  <option value="1080x1920">
    Story / Reels - 1080 x 1920
  </option>

  <option value="1920x1080">
    Landscape - 1920 x 1080
  </option>

  <option value="3000">
    Chiều dài 3000 px
  </option>

  <option value="7087x9449">
    In 60 x 80 cm - 300 DPI
  </option>
</select>

<div class="actions">

<button class="primary" id="create">
  TẠO ẢNH SUNSET
</button>

<button id="download">
  TẢI ẢNH
</button>

</div>

<p id="status">
  Chưa có ảnh đầu vào.
</p>

</section>

</main>

<footer>
  LHN STUDIO © SUNSET PHOTO & ART
</footer>

<script>
const upload = document.getElementById("upload");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

upload.addEventListener("change", function () {
  const file = upload.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    status.textContent = "Vui lòng chọn file ảnh.";
    return;
  }

  const url = URL.createObjectURL(file);

  preview.src = url;

  status.textContent = "Đã tải ảnh. Sẵn sàng tùy chỉnh.";
});

document.getElementById("create").addEventListener("click", function () {
  if (!preview.src) {
    status.textContent = "Hãy tải ảnh trước.";
    return;
  }

  const color = document.getElementById("color").value;

  const filters = {
    orange: "sepia(0.35) saturate(1.5)",
    pink: "sepia(0.2) hue-rotate(320deg) saturate(1.4)",
    red: "sepia(0.4) saturate(1.8)",
    purple: "hue-rotate(280deg) saturate(1.3)",
    gold: "sepia(0.5) saturate(1.5)"
  };

  preview.style.filter = filters[color];

  status.textContent =
    "Đã áp dụng hiệu ứng màu cơ bản. Chưa phải AI tạo ảnh.";
});

document.getElementById("download").addEventListener("click", function () {
  if (!preview.src) {
    status.textContent = "Hãy tải ảnh trước.";
    return;
  }

  const link = document.createElement("a");

  link.href = preview.src;
  link.download = "LHN-SUNSET.jpg";

  link.click();
});
</script>

</body>
</html>
